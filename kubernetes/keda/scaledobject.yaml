apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-rabbitmq-scaler

spec:
  scaleTargetRef:
    name: worker

  pollingInterval: 5
  cooldownPeriod: 30

  minReplicaCount: 0
  maxReplicaCount: 10

  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: task_queue
        mode: QueueLength
        value: "10"

      authenticationRef:
        name: rabbitmq-trigger-auth